{% if book.cover %}<div class="cover cover-{{ size }}"><img src="{{ book.cover.url }}" alt="جلد {{ book.title }}" loading="lazy"></div>{% else %}<div class="cover cover-gen cover-v{{ book.cover_variant }} cover-{{ size }}" style="--c: {{ book.cover_color }}" role="img" aria-label="جلد {{ book.title }}"><span class="cover-title">{{ book.title }}</span><span class="cover-author">{{ book.author.name }}</span></div>{% endif %}
