{% extends "base.html" %}
{% block title %}تغییر رمز عبور{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-head"><h1>تغییر رمز عبور</h1></div>
    <form method="post" class="card form" novalidate>
      {% csrf_token %}
      {% include "partials/_form_errors.html" %}
      {% for field in form %}{% include "partials/_field.html" %}{% endfor %}
      <button class="btn btn-primary btn-block" type="submit">تغییر رمز</button>
    </form>
  </div>
</div>
{% endblock %}
